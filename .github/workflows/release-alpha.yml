name: Release Alpha APK

on:
  push:
    tags:
      - 'v*-alpha*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Alpha release tag (e.g. v0.1.0-alpha1)'
        required: true
        default: 'v0.1.0-alpha1'

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Check, Build & Publish Alpha Pre-Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses & install SDK 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode optional release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/alpha-release.keystore

      - name: Run unit tests & lint before release build
        run: |
          gradle test testDebugUnitTest --stacktrace --no-daemon
          gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build Alpha APK
        env:
          TUBIAC_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'alpha-release.keystore' || '' }}
          TUBIAC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUBIAC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUBIAC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TUBIAC_VERSION_NAME: ${{ steps.tag.outputs.name }}
        run: gradle :app:assembleAlpha --stacktrace --no-daemon

      - name: Prepare release artifacts
        run: |
          mkdir -p release-dist
          APK_FILE=$(ls app/build/outputs/apk/alpha/*.apk | head -n 1)
          OUT_NAME="tubiac-${{ steps.tag.outputs.name }}.apk"
          cp "$APK_FILE" "release-dist/$OUT_NAME"
          (cd release-dist && sha256sum "$OUT_NAME" > SHA256SUMS.txt)
          ls -lh release-dist/

      - name: Publish GitHub Alpha Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Tubiac ${{ steps.tag.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-dist/*.apk
            release-dist/SHA256SUMS.txt
