name: Release Alpha APK

on:
  push:
    tags:
      - 'v*-alpha*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Alpha release tag (leave as auto to compute next version from latest release)'
        required: true
        default: 'auto'

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Check, Build & Publish Alpha Pre-Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version & build number
        id: ver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/compute_alpha_version.py --explicit-tag "${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/compute_alpha_version.py --explicit-tag "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses & install SDK 37.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Decode optional release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/alpha-release.keystore
            echo "TUBIAC_KEYSTORE_PATH=alpha-release.keystore" >> "$GITHUB_ENV"
          else
            echo "TUBIAC_KEYSTORE_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests & lint before release build
        run: |
          gradle test testDebugUnitTest --stacktrace --no-daemon
          gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build Alpha APK
        env:
          TUBIAC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUBIAC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUBIAC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TUBIAC_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          TUBIAC_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: gradle :app:assembleAlpha --stacktrace --no-daemon

      - name: Prepare release artifacts
        run: |
          mkdir -p release-dist
          APK_FILE=$(ls app/build/outputs/apk/alpha/*.apk | head -n 1)
          OUT_NAME="tubiac-${{ steps.ver.outputs.tag_name }}.apk"
          cp "$APK_FILE" "release-dist/$OUT_NAME"
          (cd release-dist && sha256sum "$OUT_NAME" > SHA256SUMS.txt)
          ls -lh release-dist/

      - name: Publish GitHub Alpha Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: Tubiac ${{ steps.ver.outputs.version_name }} (Build ${{ steps.ver.outputs.version_code }})
          prerelease: true
          generate_release_notes: true
          body: |
            Alpha release **${{ steps.ver.outputs.version_name }}** (Build `${{ steps.ver.outputs.version_code }}`).

            <!-- tubiac-build: ${{ steps.ver.outputs.version_code }} -->
          files: |
            release-dist/*.apk
            release-dist/SHA256SUMS.txt
