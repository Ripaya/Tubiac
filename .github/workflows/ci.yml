name: Alpha Check & Compile

on:
  push:
    branches:
      - main
      - develop
      - 'alpha/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses & install SDK 37.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Resolve Gradle version from wrapper
        id: gradle_ver
        run: |
          VER=$(grep -oE 'gradle-[0-9.]+-bin\.zip' gradle/wrapper/gradle-wrapper.properties | sed -E 's/gradle-([0-9.]+)-bin\.zip/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle ${{ steps.gradle_ver.outputs.version }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle_ver.outputs.version }}

      - name: Run JVM & Android unit tests
        run: gradle test testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android Lint check
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14
          if-no-files-found: ignore

  compile:
    name: Compile Debug & Alpha APKs
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute next alpha version & build number
        id: ver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/compute_alpha_version.py >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses & install SDK 37.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Resolve Gradle version from wrapper
        id: gradle_ver
        run: |
          VER=$(grep -oE 'gradle-[0-9.]+-bin\.zip' gradle/wrapper/gradle-wrapper.properties | sed -E 's/gradle-([0-9.]+)-bin\.zip/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle ${{ steps.gradle_ver.outputs.version }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle_ver.outputs.version }}

      - name: Decode alpha signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/alpha-release.keystore
            echo "TUBIAC_KEYSTORE_PATH=alpha-release.keystore" >> "$GITHUB_ENV"
          else
            echo "TUBIAC_KEYSTORE_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Assemble Debug & Alpha APKs
        env:
          TUBIAC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUBIAC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUBIAC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TUBIAC_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          TUBIAC_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: gradle :app:assembleDebug :app:assembleAlpha --stacktrace --no-daemon

      - name: Package APKs & SHA-256 Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          ALPHA_APK=$(ls app/build/outputs/apk/alpha/*.apk | head -n 1)
          cp "$ALPHA_APK" "dist/tubiac-${{ steps.ver.outputs.tag_name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Upload Alpha & Debug APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tubiac-alpha-apks-${{ github.run_number }}
          path: dist/
          retention-days: 30

  release:
    name: Auto-Publish Alpha Pre-Release
    needs: [check, compile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v8
        with:
          name: tubiac-alpha-apks-${{ github.run_number }}
          path: release-dist

      - name: Prepare release assets
        run: |
          rm -f release-dist/*-debug*.apk release-dist/SHA256SUMS.txt
          (cd release-dist && sha256sum tubiac-*.apk > SHA256SUMS.txt)
          ls -lh release-dist/
          cat release-dist/SHA256SUMS.txt

      - name: Publish GitHub Alpha Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.compile.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Tubiac ${{ needs.compile.outputs.version_name }} (Build ${{ needs.compile.outputs.version_code }})
          prerelease: true
          generate_release_notes: true
          body: |
            Automated alpha build **${{ needs.compile.outputs.version_name }}** (Build `${{ needs.compile.outputs.version_code }}`).

            <!-- tubiac-build: ${{ needs.compile.outputs.version_code }} -->
          files: |
            release-dist/tubiac-*.apk
            release-dist/SHA256SUMS.txt
