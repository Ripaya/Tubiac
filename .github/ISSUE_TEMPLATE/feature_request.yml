name: Feature Request
description: Suggest an improvement or new capability for Tubiac
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Clearly describe what you want to add or improve.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Motivation & Use Case
      description: How would this improve your reading, tracking, or extension workflow?
    validations:
      required: true
